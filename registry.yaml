schema_version: 1
repository:
  name: instrument-control-skills
  description: Community-contributed skills for instrument control, data parsing, and evidence-aware analysis.
  license: to-be-decided

skills:
  - name: siglent-sds800xhd-control
    category: control
    path: skills/siglent-sds800xhd-control
    data_kinds:
      - waveform
      - screenshot
      - measurement
    transports:
      - raw-tcp
      - usb-visa
    support:
      level: hardware-verified
      verified_model: Siglent SDS824X HD
      verified_firmware: 4.8.12.1.1.6.5
      limitations:
        - Channel-count, bandwidth, memory-depth, and firmware-dependent behavior must be confirmed on the connected model.

  - name: write-new-instrument-control
    category: authoring
    path: skills/write-new-instrument-control
    data_kinds:
      - waveform
      - scalar-measurement
      - spectrum
      - status-record
    transports: []
    support:
      level: replay-tested
      verified_model: null
      verified_firmware: null
      limitations:
        - This Skill guides creation of instrument-control Skills but does not connect to instruments itself.
        - Hardware-specific behavior remains documented or replay-tested until real evidence is supplied.
